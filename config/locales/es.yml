    year_2023_title: "EL COMIENZO"
    year_2023_text: "La tecnología entró en mi trayectoria como una nueva posibilidad. Entre código, liderazgo y construcción colectiva, comencé a explorar un territorio que, más tarde, se conectaría con muchos otros."

    year_2024_title: "AMPLIANDO HORIZONTES"
    year_2024_text: "Ingresé a Google Brasil y pasé a vivenciar tecnología, creatividad y negocios dentro de un entorno global. Entre proyectos, colaboración internacional y la organización de un evento en Argentina, 2024 amplió mi visión sobre lo que podía construir y hasta dónde podían llevarme mis habilidades."

    year_2025_title: "ENTRE MUNDOS"
    year_2025_text: "Este año marcó el fin de un ciclo y el inicio de varios otros. Concluí el programa de aprendizaje de Google, obtuve mi pasantía en Santander y pasé a actuar más cerca de tecnología, operaciones y estrategia. En paralelo, viví ocho meses como estudiante investigadora en CPQD, profundizando mis conocimientos en redes privadas y participando en la redacción de un artículo técnico."

    year_2026_title: "AHORA"
    year_2026_text: "Un cambio de área dentro de Santander aportó una nueva perspectiva a mi trayectoria. Pasé a analizar de cerca los indicadores que reflejan el desempeño organizacional, especialmente en tecnología, comprendiendo no solo los números, sino lo que revelan sobre procesos, prioridades y decisiones."

