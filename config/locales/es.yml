    reelist:
      world: "TECNOLOGÍA / THE LAB"
      title: "REELIST"
      subtitle: "Catálogo Interactivo de Películas y Manipulación del DOM"
      overview_text: "Reelist es un catálogo interactivo de películas construido a partir de un arreglo en JavaScript. Cada película se almacena como un objeto dentro del Array, con información como título, año, género, descripción e imagen."
      challenge_text: "La interfaz fue inspirada en la estética cinematográfica, utilizando una paleta en tonos de rojo, borgoña y colores claros. El diseño fue pensado para destacar los carteles y presentar la colección de forma simple, moderna y organizada."
      solution_text: "JavaScript recorre el arreglo usando un bucle for y crea las tarjetas de películas dinámicamente en la página. El usuario puede buscar películas por título, filtrar por género y hacer clic para ver más detalles."
      feature_1: "Arreglos y Objetos JS para almacenar título, año, género, descripción e imagen"
      feature_2: "Renderización dinámica del DOM con bucle for, createElement() e innerHTML"
      feature_3: "Búsqueda por título y filtros por género con .filter() e .includes()"
      feature_4: "Estética Cinematográfica con paleta en tonos de rojo y borgoña"

    creative:
      world: "CREATIVIDAD"
      title: "El Teatro de Sombras de Ofelia"
      subtitle: "Teatro · Interpretación · Expresión Escénica"
      overview_text: "Durante mi formación en programación en el Instituto PROA (Senac), surgió la oportunidad de participar en un proyecto teatral junto a otros estudiantes. La presentación fue una adaptación inspirada en El Teatro de Sombras de Ofelia, obra de Michael Ende, llevando al escenario una narrativa marcada por la imaginación, las sombras y el poder transformador del arte."
      challenge_text: "Mientras mis días se enfocaban en la tecnología y la programación, el proyecto abrió espacio para explorar otra forma de creación: el teatro."
      solution_text: "Participé en el montaje como actriz, interpretando diferentes personajes a lo largo de la obra. La experiencia involucró ensayos, construcción colectiva, interpretación, expresión corporal y presencia escénica. Más que una actividad paralela a mi formación, fue una oportunidad de continuar explorando una relación con el arte que ya formaba parte de mi trayectoria —esta vez, a través del escenario."
      feature_1: "Contexto: Instituto PROA · Senac"
      feature_2: "Proyecto: Adaptación teatral de El Teatro de Sombras de Ofelia"
      feature_3: "Autor de la obra: Michael Ende"
      feature_4: "Actuación: Interpretación de múltiples personajes"
      watch_reference: "Ver referencia de la obra"

    strategy:
      world: "03 · THE FORGE / STRATEGY"
      title: "NEXA by Ashilay"
      subtitle: "Plataforma de autoconocimiento aplicado para elecciones conscientes y movimiento."
      strategy_construction_tag: "ESTRUCTURA & MÉTODO"
      overview_text: "NEXA conecta la reflexión personal con la práctica real. Estructurada desde su esencia — propósito, posicionamiento, experiencia y MVP digital —, permite probar caminos de crecimiento en tiempo real."
      challenge_text: "Simplificar el autoconocimiento en un producto digital claro, contemporáneo y práctico — sin clichés ni frases motivacionales."
      solution_text: "Metodología estructurada en 3 pasos:<br><br>• <strong>Conocer:</strong> Mapear valores y límites.<br>• <strong>Elegir:</strong> Tomar decisiones conscientes.<br>• <strong>Mover:</strong> Transformar claridad en acción."
      feature_1_title: "Brand Strategy"
      feature_1: "Posicionamiento, propósito e identidad"
      feature_2_title: "Método NEXA"
      feature_2: "Framework Conocer → Elegir → Mover"
      feature_3_title: "Experiencia Digital"
      feature_3: "Interfaz guiada por elecciones"
      feature_4_title: "MVP Interactivo"
      feature_4: "Plataforma en vivo lista para explorar"

