    reelist:
      world: "TECHNOLOGY / THE LAB"
      title: "REELIST"
      subtitle: "Interactive Movie Catalog & DOM Manipulation"
      overview_text: "Reelist is an interactive movie catalog built using JavaScript arrays. Each movie is stored as an object inside the array, containing details like title, release year, genre, description, and poster image."
      challenge_text: "The interface was inspired by cinematic aesthetics, featuring a color palette of red, burgundy, and clean light tones. The design was crafted to highlight posters and display the collection in a modern, organized way."
      solution_text: "JavaScript iterates through the array using a for loop to render movie cards dynamically on the page. Users can search movies by title, filter the collection by genre, and click cards for detailed views."
      feature_1: "JS Arrays & Objects storing title, year, genre, description, and poster"
      feature_2: "Dynamic DOM rendering with for loop, createElement(), and innerHTML"
      feature_3: "Title search and genre filtering powered by .filter() and .includes()"
      feature_4: "Cinematic aesthetic featuring red and burgundy color palette"

    creative:
      world: "CREATIVITY"
      title: "Ophelia's Shadow Theater"
      subtitle: "Theater · Acting · Stage Expression"
      overview_text: "During my programming training at the PROA Institute (Senac), the opportunity arose to participate in a theater project with fellow students. The performance was an adaptation inspired by Ophelia's Shadow Theater by Michael Ende, bringing to the stage a narrative marked by imagination, shadows, and the transformative power of art."
      challenge_text: "While my days were focused on tech and coding, the project opened space to explore another form of creation: theater."
      solution_text: "I participated in the production as an actress, portraying multiple characters throughout the performance. The experience involved rehearsals, collective creation, acting, body expression, and stage presence. More than an activity parallel to my training, it was an opportunity to continue exploring a relationship with art that was already part of my journey — this time, on stage."
      feature_1: "Context: PROA Institute · Senac"
      feature_2: "Project: Stage adaptation of Ophelia's Shadow Theater"
      feature_3: "Author of the work: Michael Ende"
      feature_4: "Acting: Performance of multiple characters"
      watch_reference: "Watch work reference"

    strategy:
      world: "03 · THE FORGE / STRATEGY"
      title: "NEXA by Ashilay"
      subtitle: "Applied self-knowledge platform for intentional choices and action."
      strategy_construction_tag: "FRAMEWORK & METHOD"
      overview_text: "NEXA bridges personal reflection and real-life practice. Built from its core — purpose, positioning, copy, and digital MVP — the interactive experience empowers users to test growth paths live."
      challenge_text: "Transforming abstract self-knowledge into a sleek, practical, and non-generic digital product — free of motivation jargon."
      solution_text: "Structured 3-step methodology:<br><br>• <strong>Discover:</strong> Map core values and boundaries.<br>• <strong>Choose:</strong> Make intentional decisions.<br>• <strong>Move:</strong> Turn clarity into action."
      feature_1_title: "Brand Strategy"
      feature_1: "Positioning, purpose & identity"
      feature_2_title: "NEXA Method"
      feature_2: "Discover → Choose → Move framework"
      feature_3_title: "Digital Experience"
      feature_3: "Choice-driven web application"
      feature_4_title: "Interactive MVP"
      feature_4: "Live platform ready to explore"

