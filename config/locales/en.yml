    year_2024_text: "I joined Google Brazil and started experiencing technology, creativity, and business within a global environment. Through projects, international collaboration, and organizing an event in Argentina, 2024 expanded my vision of what I could build and where my skills could take me."

    year_2025_title: "BETWEEN WORLDS"
    year_2025_text: "This year marked the end of one chapter and the beginning of several others. I graduated from Google's apprenticeship program, secured my internship at Santander, and began working closer to technology, operations, and strategy. Concurrently, I spent eight months as a student researcher at CPQD, deepening my knowledge in private networks and co-authoring a technical paper."

    year_2026_title: "NOW"
    year_2026_text: "A domain transition within Santander brought a fresh perspective to my career. I began closely analyzing key performance indicators that reflect organizational health, particularly in tech, understanding not just the metrics, but what they reveal about processes, priorities, and decisions."

