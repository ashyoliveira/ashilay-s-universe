    year_2023_title: "O COMEÇO"
    year_2023_text: "A tecnologia entrou na minha trajetória como uma nova possibilidade. Entre código, liderança e construção coletiva, comecei a explorar um território que, mais tarde, se conectaria a muitos outros."

    year_2024_title: "EXPANDINDO HORIZONTES"
    year_2024_text: "Entrei no Google Brasil e passei a vivenciar tecnologia, criatividade e negócios dentro de um ambiente global. Entre projetos, colaboração internacional e a organização de um evento na Argentina, 2024 ampliou minha visão sobre o que eu poderia construir e onde minhas habilidades poderiam me levar"

    year_2025_title: "ENTRE MUNDOS"
    year_2025_text: "este ano marcou o fim de um ciclo e o início de vários outros. Saí do programa de aprendizagem do Google, conquistei meu estágio no Santander e passei a atuar mais próxima de tecnologia, operações e estratégia. Em paralelo, vivi oito meses como estudante pesquisadora no CPQD, aprofundando meus conhecimentos em redes privativas e participando da construção de um artigo técnico."

    year_2026_title: "AGORA"
    year_2026_text: "Uma mudança de área dentro do Santander trouxe uma nova perspectiva para minha trajetória. Passei a olhar mais de perto para os indicadores que traduzem o desempenho da organização, especialmente em tecnologia, entendendo não apenas os números, mas o que eles revelam sobre processos, prioridades e decisões."

