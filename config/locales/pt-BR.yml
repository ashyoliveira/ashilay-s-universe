    reelist:
      world: "TECNOLOGIA / THE LAB"
      title: "REELIST"
      subtitle: "Catálogo Interativo de Filmes & Manipulação do DOM"
      overview_text: "O Reelist é um catálogo interativo de filmes construído a partir de um vetor em JavaScript. Cada filme é armazenado como um objeto dentro do Array, contendo informações como título, ano, gênero, descrição e imagem."
      challenge_text: "A interface do Reelist foi inspirada na estética cinematográfica, utilizando uma paleta em tons de vermelho, bordô e cores claras. O design foi pensado para destacar os pôsteres e apresentar a coleção de forma simples, moderna e organizada."
      solution_text: "O JavaScript percorre o vetor utilizando o laço for e cria os cards dos filmes dinamicamente na página. O usuário pode pesquisar filmes pelo título, filtrar a coleção por gênero e clicar nos cards para visualizar mais informações."
      feature_1: "Vetores (Array) & Objetos JS armazenando título, ano, gênero, descrição e imagem"
      feature_2: "Renderização dinâmica do DOM com laço for, createElement() e innerHTML"
      feature_3: "Busca por título e filtros por gênero com .filter() e .includes()"
      feature_4: "Estética Cinematográfica com paleta em tons de vermelho e bordô"

    creative:
      world: "CRIATIVIDADE"
      title: "O Teatro de Sombras de Ofélia"
      subtitle: "Teatro · Interpretação · Expressão Cênica"
      overview_text: "Durante minha formação em programação pelo Instituto PROA, no Senac, surgiu a oportunidade de participar de um projeto teatral com outros estudantes da instituição. A apresentação foi uma adaptação inspirada em O Teatro de Sombras de Ofélia, obra de Michael Ende, e trouxe para o palco uma narrativa marcada pela imaginação, pelas sombras e pelo poder transformador da arte."
      challenge_text: "Enquanto meus dias eram voltados à tecnologia e à programação, o projeto abriu espaço para explorar outra forma de criação: o teatro."
      solution_text: "Participei da montagem como atriz, interpretando diferentes personagens ao longo da apresentação. A experiência envolveu ensaios, construção coletiva, interpretação, expressão corporal e presença cênica. Mais do que uma atividade paralela à minha formação, foi uma oportunidade de continuar explorando uma relação com a arte que já fazia parte da minha trajetória — dessa vez, através do palco."
      feature_1: "Contexto: Instituto PROA · Senac"
      feature_2: "Projeto: Adaptação teatral de O Teatro de Sombras de Ofélia"
      feature_3: "Autor da obra: Michael Ende"
      feature_4: "Atuação: Interpretação de múltiplos personagens"
      watch_reference: "Assistir à referência da obra"

    strategy:
      world: "03 · THE FORGE / STRATEGY"
      title: "NEXA by Ashilay"
      subtitle: "Plataforma de autoconhecimento aplicado para escolhas conscientes e movimento."
      strategy_construction_tag: "ESTRUTURA & MÉTODO"
      overview_text: "A NEXA conecta reflexão pessoal à prática real. Estruturada desde a essência — propósito, público, posicionamento, linguagem e MVP digital —, a experiência permite testar caminhos de desenvolvimento em tempo real."
      challenge_text: "Desmontar a complexidade do autoconhecimento em uma jornada digital clara, contemporânea e prática — sem clichês ou motivação vazia."
      solution_text: "Metodologia em 3 passos estruturados:<br><br>• <strong>Conhecer:</strong> Mapear valores, limites e desejos.<br>• <strong>Escolher:</strong> Tomar decisões com intenção.<br>• <strong>Mover:</strong> Transformar clareza em ação."
      feature_1_title: "Brand Strategy"
      feature_1: "Posicionamento, propósito e identidade."
      feature_2_title: "Método NEXA"
      feature_2: "Framework Conhecer → Escolher → Mover."
      feature_3_title: "Experiência Digital"
      feature_3: "Interface interativa orientada por escolhas."
      feature_4_title: "MVP Interactivo"
      feature_4: "Aplicação ao vivo pronta para exploração."


