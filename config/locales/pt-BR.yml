    creative_category: "Teatro · Interpretação · Expressão · Storytelling"
    creative_description: "Durante minha formação em programação pelo PROA, no Senac, encontrei espaço para explorar uma linguagem completamente diferente da tecnologia: o teatro. Uma adaptação inspirada em Michael Ende que marcou minha forma de criar, comunicar e colaborar."
